<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Everything Market</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f6f8; color: #111; min-height: 100vh; }

  /* ── Login ── */
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: #fff; border-radius: 14px; padding: 40px 36px; width: 340px; box-shadow: 0 4px 24px rgba(0,0,0,.10); text-align: center; }
  .login-box h1 { font-size: 22px; color: #0A3D22; margin-bottom: 6px; }
  .login-box p { font-size: 13px; color: #666; margin-bottom: 24px; }
  .login-box input { width: 100%; padding: 11px 14px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 14px; }
  .login-box input:focus { border-color: #1A7A42; outline: none; }
  .login-btn { width: 100%; padding: 12px; background: #1A7A42; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .login-btn:hover { background: #145C35; }
  .login-err { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }

  /* ── Dashboard ── */
  #dashboard { display: none; }
  .adm-header { background: #0A3D22; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .adm-header h1 { font-size: 17px; font-weight: 800; white-space: nowrap; }
  .adm-header-right { display: flex; align-items: center; gap: 12px; }
  .adm-time { font-size: 12px; opacity: .7; }
  .btn-ga { background: #E37400; color: #fff; border: none; padding: 7px 14px; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .btn-ga:hover { background: #c56200; }

  /* ── Stats ── */
  .adm-stats { display: flex; gap: 12px; padding: 16px 24px 0; flex-wrap: wrap; }
  .stat-card { background: #fff; border-radius: 10px; padding: 14px 18px; flex: 1; min-width: 110px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .stat-card .num { font-size: 26px; font-weight: 800; color: #0A3D22; }
  .stat-card .lbl { font-size: 11px; color: #666; margin-top: 2px; }
  .stat-card.blue .num { color: #1565C0; }
  .stat-card.orange .num { color: #E37400; }
  .stat-card.red .num { color: #C0392B; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 0; padding: 16px 24px 0; border-bottom: 2px solid #e8ede9; margin: 0 0 0; }
  .tab { padding: 10px 22px; border-bottom: 3px solid transparent; font-weight: 700; font-size: 14px; cursor: pointer; color: #666; margin-bottom: -2px; transition: color .15s; }
  .tab.active { border-bottom-color: #1A7A42; color: #0A3D22; }
  .tab:hover:not(.active) { color: #333; }

  /* ── Filter bar ── */
  .filter-bar { padding: 14px 24px 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .filter-bar input { flex: 1; min-width: 180px; padding: 9px 14px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; }
  .filter-bar input:focus { border-color: #1A7A42; outline: none; }
  .filter-bar select { padding: 9px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; background: #fff; }

  /* ── Tables ── */
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .tbl-wrap { padding: 0 24px 40px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.06); font-size: 13px; }
  thead { background: #f0f4f1; }
  th { padding: 11px 14px; text-align: left; font-weight: 700; color: #333; white-space: nowrap; }
  td { padding: 10px 14px; border-top: 1px solid #f0f0f0; vertical-align: middle; }
  tr:hover td { background: #fafffe; }
  .ad-title { font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ad-photo { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #eee; display: block; }
  .no-photo { width: 44px; height: 44px; border-radius: 6px; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .badge-priv  { background: #e8f5e9; color: #2e7d32; }
  .badge-biz   { background: #e3f2fd; color: #1565c0; }
  .badge-spons { background: #fff8e1; color: #f57f17; }
  .badge-conf  { background: #e8f5e9; color: #2e7d32; }
  .badge-pend  { background: #fff3e0; color: #e65100; }
  .btn-del { background: #c0392b; color: #fff; border: none; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn-del:hover { background: #922b21; }
  .btn-del:disabled { background: #ccc; cursor: default; }
  .btn-vfy { background: #1A7A42; color: #fff; border: none; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; margin-right: 4px; }
  .btn-vfy:hover { background: #145C35; }
  .btn-vfy.unvfy { background: #7B4800; }
  .btn-vfy.unvfy:hover { background: #5a3400; }
  .btn-vfy:disabled { background: #ccc; cursor: default; }
  .empty { text-align: center; padding: 40px; color: #999; }
  .loading { text-align: center; padding: 40px; color: #666; }

  /* ── User avatar ── */
  .u-avatar { width: 34px; height: 34px; border-radius: 50%; background: #0A3D22; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0; }

  /* ── Chats ── */
  .chat-list { padding: 0 24px 40px; display: flex; flex-direction: column; gap: 10px; }
  .chat-card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; }
  .chat-head { padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
  .chat-head:hover { background: #f8fffe; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-names { font-weight: 700; font-size: 13px; color: #111; margin-bottom: 2px; }
  .chat-ad { font-size: 12px; color: #1A7A42; margin-bottom: 3px; }
  .chat-preview { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-meta { text-align: right; flex-shrink: 0; }
  .chat-time { font-size: 11px; color: #999; }
  .chat-count { font-size: 11px; font-weight: 700; color: #1A7A42; margin-top: 2px; }
  .chat-body { display: none; border-top: 1px solid #f0f0f0; padding: 12px 16px; }
  .chat-body.open { display: block; }
  .msg-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-start; }
  .msg-bubble { background: #f0f4f1; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; line-height: 1.5; max-width: 75%; }
  .msg-bubble.out { background: #e3f2fd; }
  .msg-sender { font-size: 10px; color: #999; margin-bottom: 2px; }
  .msg-time { font-size: 10px; color: #bbb; margin-top: 3px; }
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <h1>🛡️ Admin Panel</h1>
    <p>Everything Market</p>
    <input type="password" id="adm-pass" placeholder="Admin password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="login-err">Incorrect password.</div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="adm-header">
    <h1>🛡️ Everything Market Admin</h1>
    <div class="adm-header-right">
      <span class="adm-time" id="adm-time"></span>
      <a class="btn-ga" href="https://analytics.google.com/analytics/web/#/p550104180/reports/home" target="_blank">📊 Google Analytics</a>
    </div>
  </div>

  <!-- Stats -->
  <div class="adm-stats">
    <div class="stat-card"><div class="num" id="stat-total">–</div><div class="lbl">Total Ads</div></div>
    <div class="stat-card"><div class="num" id="stat-today">–</div><div class="lbl">Posted Today</div></div>
    <div class="stat-card"><div class="num" id="stat-photos">–</div><div class="lbl">With Photos</div></div>
    <div class="stat-card"><div class="num" id="stat-sellers">–</div><div class="lbl">Unique Sellers</div></div>
    <div class="stat-card blue"><div class="num" id="stat-users">–</div><div class="lbl">Registered Users</div></div>
    <div class="stat-card blue"><div class="num" id="stat-users-today">–</div><div class="lbl">New Users Today</div></div>
    <div class="stat-card orange"><div class="num" id="stat-msgs">–</div><div class="lbl">Messages Sent</div></div>
    <div class="stat-card orange"><div class="num" id="stat-boosted">–</div><div class="lbl">Boosted Ads</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('ads')">📋 Ads</div>
    <div class="tab" onclick="switchTab('users')">👥 Users</div>
    <div class="tab" onclick="switchTab('chats')">💬 Chats</div>
  </div>

  <!-- ── ADS TAB ── -->
  <div class="tab-content active" id="tab-ads">
    <div class="filter-bar">
      <input type="text" id="srch" placeholder="Search by title or seller…" oninput="renderAdsTable()">
      <select id="cat-filter" onchange="renderAdsTable()">
        <option value="">All categories</option>
        <option value="elec">Electronics</option>
        <option value="furn">Furniture</option>
        <option value="clth">Clothing</option>
        <option value="cars">Cars</option>
        <option value="prop">Property</option>
        <option value="serv">Services</option>
        <option value="jobs">Jobs</option>
        <option value="game">Gaming</option>
        <option value="sport">Sport</option>
        <option value="book">Books</option>
        <option value="food">Food</option>
        <option value="pet">Pets</option>
        <option value="other">Other</option>
      </select>
      <select id="sort-by" onchange="renderAdsTable()">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="price-hi">Price high–low</option>
        <option value="price-lo">Price low–high</option>
      </select>
    </div>
    <div class="tbl-wrap">
      <div id="ads-wrap"><div class="loading">Loading ads…</div></div>
    </div>
  </div>

  <!-- ── USERS TAB ── -->
  <div class="tab-content" id="tab-users">
    <div class="filter-bar">
      <input type="text" id="user-srch" placeholder="Search by name or email…" oninput="renderUsersTable()">
      <select id="user-sort" onchange="renderUsersTable()">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="ads">Most ads</option>
      </select>
    </div>
    <div class="tbl-wrap">
      <div id="users-wrap"><div class="loading">Loading users…</div></div>
    </div>
  </div>

  <!-- ── CHATS TAB ── -->
  <div class="tab-content" id="tab-chats">
    <div class="filter-bar">
      <input type="text" id="chat-srch" placeholder="Search by name, email or ad…" oninput="renderChats()">
    </div>
    <div class="chat-list" id="chat-list"><div class="loading">Loading chats…</div></div>
  </div>
</div>

<script>
  let ALL_ADS   = [];
  let ALL_USERS = [];
  let ALL_CHATS = [];
  let ADMIN_TOKEN = sessionStorage.getItem('em_admin_token') || '';

  function adminHeaders(extra) {
    return {
      ...(extra || {}),
      ...(ADMIN_TOKEN ? { Authorization: 'Bearer ' + ADMIN_TOKEN } : {}),
    };
  }

  /* ── Login ── */
  async function doLogin() {
    const passEl = document.getElementById('adm-pass');
    const errEl = document.getElementById('login-err');
    errEl.style.display = 'none';
    try {
      const r = await fetch('/api/admin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: passEl.value })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.token) throw new Error(j.error || 'Sign in failed');
      ADMIN_TOKEN = j.token;
      sessionStorage.setItem('em_admin_token', ADMIN_TOKEN);
    } catch (e) {
      errEl.textContent = e.message || 'Incorrect password.';
      document.getElementById('login-err').style.display = 'block';
      return;
    }
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadAll();
    setInterval(() => {
      document.getElementById('adm-time').textContent = new Date().toLocaleString('en-ZA');
    }, 1000);
  }

  /* ── Tab switching ── */
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['ads','users','chats'][i] === name));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
  }

  /* ── Load everything ── */
  async function loadAll() {
    loadAds();
    loadUsers();
    loadChats();
  }

  /* ── ADS ── */
  async function loadAds() {
    try {
      const r = await fetch('/api/load-ads');
      ALL_ADS = await r.json();
      updateStats();
      renderAdsTable();
    } catch(e) {
      document.getElementById('ads-wrap').innerHTML = '<div class="empty">Failed to load ads.</div>';
    }
  }

  function updateStats() {
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('stat-total').textContent   = ALL_ADS.length;
    document.getElementById('stat-today').textContent   = ALL_ADS.filter(a => (a.created_at || '').startsWith(today)).length;
    document.getElementById('stat-photos').textContent  = ALL_ADS.filter(a => Array.isArray(a.photos) && a.photos.length).length;
    document.getElementById('stat-sellers').textContent = new Set(ALL_ADS.map(a => a.seller)).size;
    document.getElementById('stat-boosted').textContent = ALL_ADS.filter(a => a.sponsored).length;
  }

  function renderAdsTable() {
    const q    = document.getElementById('srch').value.trim().toLowerCase();
    const cat  = document.getElementById('cat-filter').value;
    const sort = document.getElementById('sort-by').value;
    let ads = ALL_ADS.filter(a => {
      if (q && !(a.title || '').toLowerCase().includes(q) && !(a.seller || '').toLowerCase().includes(q)) return false;
      if (cat && (a.cat || '') !== cat) return false;
      return true;
    });
    ads.sort((a, b) => {
      if (sort === 'newest')   return new Date(b.created_at) - new Date(a.created_at);
      if (sort === 'oldest')   return new Date(a.created_at) - new Date(b.created_at);
      if (sort === 'price-hi') return (b.price || 0) - (a.price || 0);
      if (sort === 'price-lo') return (a.price || 0) - (b.price || 0);
      return 0;
    });
    if (!ads.length) { document.getElementById('ads-wrap').innerHTML = '<div class="empty">No ads found.</div>'; return; }
    const rows = ads.map(a => {
      const photo = Array.isArray(a.photos) && a.photos[0]
        ? `<img class="ad-photo" src="${a.photos[0]}" onerror="this.style.display='none'">`
        : `<div class="no-photo">📷</div>`;
      const price = a.price === 0 ? 'Contact for Price' : 'R ' + Number(a.price).toLocaleString('en-ZA');
      const date  = a.created_at ? new Date(a.created_at).toLocaleDateString('en-ZA') : '–';
      const badge = a.seller_type === 'business'
        ? `<span class="badge badge-biz">Business</span>`
        : `<span class="badge badge-priv">Private</span>`;
      const spons = a.sponsored ? `<span class="badge badge-spons">⚡ Boosted</span>` : '';
      const email = a.contact_email ? `<a href="mailto:${a.contact_email}" style="color:#1565C0;text-decoration:none;">${a.contact_email}</a>` : '–';
      const phone = a.phone ? `<a href="tel:${a.phone}" style="color:#1565C0;text-decoration:none;">${a.phone}</a>` : '–';
      return `<tr id="row-${a.id}">
        <td>${photo}</td>
        <td><div class="ad-title" title="${(a.title||'').replace(/"/g,'&quot;')}">${a.title || '–'}</div></td>
        <td>${a.cat || '–'}</td>
        <td>${price}</td>
        <td>${a.seller || '–'} ${badge} ${spons}</td>
        <td>${email}</td>
        <td>${phone}</td>
        <td>${a.loc || '–'}</td>
        <td>${date}</td>
        <td><button class="btn-del" onclick="deleteAd('${a.id}',this)">Delete</button></td>
      </tr>`;
    }).join('');
    document.getElementById('ads-wrap').innerHTML = `
      <table>
        <thead><tr><th>Photo</th><th>Title</th><th>Cat</th><th>Price</th><th>Seller</th><th>Email</th><th>Phone</th><th>Location</th><th>Posted</th><th>Action</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  async function deleteAd(id, btn) {
    if (!confirm('Delete this ad? This cannot be undone.')) return;
    btn.disabled = true; btn.textContent = '…';
    try {
      const r = await fetch('/api/delete-ad', { method: 'POST', headers: adminHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ id }) });
      const j = await r.json();
      if (j.ok) {
        ALL_ADS = ALL_ADS.filter(a => String(a.id) !== String(id));
        document.getElementById('row-' + id)?.remove();
        updateStats();
      } else { btn.disabled = false; btn.textContent = 'Delete'; alert('Delete failed: ' + (j.error || 'unknown')); }
    } catch(e) { btn.disabled = false; btn.textContent = 'Delete'; alert('Error: ' + e.message); }
  }

  /* ── USERS ── */
  async function loadUsers() {
    try {
      const r = await fetch('/api/load-users', { headers: adminHeaders() });
      if (!r.ok) throw new Error('Status ' + r.status);
      ALL_USERS = await r.json();
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('stat-users').textContent       = ALL_USERS.length;
      document.getElementById('stat-users-today').textContent = ALL_USERS.filter(u => (u.created_at || '').startsWith(today)).length;
      renderUsersTable();
    } catch(e) {
      document.getElementById('users-wrap').innerHTML = '<div class="empty">Failed to load users: ' + e.message + '</div>';
    }
  }

  function renderUsersTable() {
    const q    = (document.getElementById('user-srch')?.value || '').trim().toLowerCase();
    const sort = document.getElementById('user-sort')?.value || 'newest';
    let users = ALL_USERS.filter(u =>
      !q || (u.email || '').toLowerCase().includes(q) || (u.name || '').toLowerCase().includes(q)
    );
    users.sort((a, b) => {
      if (sort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
      if (sort === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
      if (sort === 'ads')    return (b.ad_count || 0) - (a.ad_count || 0);
      return 0;
    });
    if (!users.length) { document.getElementById('users-wrap').innerHTML = '<div class="empty">No users found.</div>'; return; }
    const rows = users.map(u => {
      const initials = (u.name || u.email || '?').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
      const joined   = u.created_at ? new Date(u.created_at).toLocaleDateString('en-ZA') : '–';
      const lastSeen = u.last_sign_in ? new Date(u.last_sign_in).toLocaleDateString('en-ZA') : 'Never';
      const confBadge = u.verified
        ? '<span class="badge badge-conf">✅ Verified Seller</span>'
        : (u.confirmed ? '<span class="badge badge-pend">Email OK</span>' : '<span class="badge badge-pend">Unverified</span>');
      /* Pull phone from any ad belonging to this user */
      const userAd = ALL_ADS.find(a => a.contact_email === u.email || (a.user_id && String(a.user_id) === String(u.id)));
      const phone  = userAd?.phone ? `<a href="tel:${userAd.phone}" style="color:#1565C0;text-decoration:none;">${userAd.phone}</a>` : '–';
      const email  = u.email ? `<a href="mailto:${u.email}" style="color:#1565C0;text-decoration:none;">${u.email}</a>` : '–';
      return `<tr id="urow-${u.id}">
        <td><div style="display:flex;align-items:center;gap:8px;"><div class="u-avatar">${initials}</div><div style="font-weight:700;font-size:13px;">${u.name || '–'}</div></div></td>
        <td>${email}</td>
        <td>${phone}</td>
        <td>${confBadge}</td>
        <td>${u.ad_count || 0}</td>
        <td>${joined}</td>
        <td>${lastSeen}</td>
        <td>
          <button class="btn-vfy ${u.verified ? 'unvfy' : ''}" onclick="toggleVerify('${u.id}',${!u.verified},this)">${u.verified ? 'Unverify' : 'Verify'}</button>
          <button class="btn-del" onclick="deleteUser('${u.id}','${(u.email||'').replace(/'/g,"\\'")}',this)">Delete</button>
        </td>
      </tr>`;
    }).join('');
    document.getElementById('users-wrap').innerHTML = `
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Ads</th><th>Joined</th><th>Last Seen</th><th>Actions</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  async function toggleVerify(userId, newVerified, btn) {
    btn.disabled = true; btn.textContent = '…';
    try {
      const r = await fetch('/api/verify-user', { method: 'POST', headers: adminHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ userId, verified: newVerified }) });
      const j = await r.json();
      if (j.ok) {
        const u = ALL_USERS.find(x => x.id === userId);
        if (u) u.verified = newVerified;
        btn.textContent = newVerified ? 'Unverify' : 'Verify';
        btn.classList.toggle('unvfy', newVerified);
        btn.onclick = () => toggleVerify(userId, !newVerified, btn);
        /* Update status badge in same row */
        const row = btn.closest('tr');
        if (row) {
          const statusCell = row.querySelector('td:nth-child(4)');
          if (statusCell) statusCell.innerHTML = newVerified
            ? '<span class="badge badge-conf">✅ Verified Seller</span>'
            : '<span class="badge badge-pend">Email OK</span>';
        }
      } else {
        btn.disabled = false; btn.textContent = newVerified ? 'Verify' : 'Unverify';
        alert('Failed: ' + (j.error || 'unknown'));
      }
    } catch(e) { btn.disabled = false; btn.textContent = newVerified ? 'Verify' : 'Unverify'; alert('Error: ' + e.message); }
  }

  async function deleteUser(userId, email, btn) {
    if (!confirm(`Delete user ${email}?\nThis will also delete all their ads. This cannot be undone.`)) return;
    btn.disabled = true; btn.textContent = '…';
    try {
      const r = await fetch('/api/delete-user', { method: 'POST', headers: adminHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ userId, email }) });
      const j = await r.json();
      if (j.ok) {
        ALL_USERS = ALL_USERS.filter(u => u.id !== userId);
        ALL_ADS   = ALL_ADS.filter(a => a.seller_email !== email);
        document.getElementById('urow-' + userId)?.remove();
        const today = new Date().toISOString().slice(0, 10);
        document.getElementById('stat-users').textContent       = ALL_USERS.length;
        document.getElementById('stat-users-today').textContent = ALL_USERS.filter(u => (u.created_at||'').startsWith(today)).length;
        updateStats();
      } else { btn.disabled = false; btn.textContent = 'Delete'; alert('Delete failed: ' + (j.error || 'unknown')); }
    } catch(e) { btn.disabled = false; btn.textContent = 'Delete'; alert('Error: ' + e.message); }
  }

  /* ── CHATS ── */
  async function loadChats() {
    try {
      const r = await fetch('/api/load-chats', { headers: adminHeaders() });
      if (!r.ok) throw new Error('Status ' + r.status);
      ALL_CHATS = await r.json();
      document.getElementById('stat-msgs').textContent = ALL_CHATS.reduce((s, c) => s + c.messages.length, 0);
      renderChats();
    } catch(e) {
      document.getElementById('chat-list').innerHTML = '<div class="empty">Failed to load chats: ' + e.message + '</div>';
    }
  }

  function renderChats() {
    const q = (document.getElementById('chat-srch')?.value || '').trim().toLowerCase();
    let chats = ALL_CHATS.filter(c =>
      !q ||
      (c.sender_email || '').toLowerCase().includes(q) ||
      (c.sender_name  || '').toLowerCase().includes(q) ||
      (c.recipient_email || '').toLowerCase().includes(q) ||
      (c.seller       || '').toLowerCase().includes(q) ||
      (c.ad_title     || '').toLowerCase().includes(q)
    );
    if (!chats.length) { document.getElementById('chat-list').innerHTML = '<div class="empty">No chats found.</div>'; return; }
    document.getElementById('chat-list').innerHTML = chats.map((c, i) => {
      const last = c.messages[0] || {};
      const time = c.last_at ? new Date(c.last_at).toLocaleString('en-ZA', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
      const msgs = c.messages.map(m => `
        <div class="msg-row">
          <div class="msg-bubble">
            <div class="msg-sender">${m.from_name || m.from}</div>
            ${m.text}
            <div class="msg-time">${new Date(m.time).toLocaleString('en-ZA', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })}</div>
          </div>
        </div>`).join('');
      return `
        <div class="chat-card">
          <div class="chat-head" onclick="toggleChat('chat-body-${i}')">
            <div style="font-size:26px;line-height:1;">💬</div>
            <div class="chat-info">
              <div class="chat-names">${c.sender_name || c.sender_email} → ${c.seller || c.recipient_email}</div>
              <div class="chat-ad">Re: ${c.ad_title || 'Unknown ad'}</div>
              <div class="chat-preview">${(last.text || '').slice(0, 80)}</div>
            </div>
            <div class="chat-meta">
              <div class="chat-time">${time}</div>
              <div class="chat-count">${c.messages.length} msg${c.messages.length !== 1 ? 's' : ''}</div>
            </div>
          </div>
          <div class="chat-body" id="chat-body-${i}">
            <div style="font-size:11px;color:#999;margin-bottom:10px;">
              From: <strong>${c.sender_email}</strong> → To: <strong>${c.recipient_email}</strong>
            </div>
            ${msgs}
          </div>
        </div>`;
    }).join('');
  }

  function toggleChat(id) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('open');
  }
</script>
</body>
</html>
